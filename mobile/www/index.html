<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CARMEN</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #F6F7FB;
        color: #1F2A37;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        background: #FFFFFF;
        border: 1px solid #E3E8EF;
        border-radius: 12px;
        padding: 32px 24px;
      }
      h1 { margin: 0 0 8px; font-size: 1.5rem; color: #1976D2; }
      p { margin: 0; color: #5B6B7C; }
    </style>
  </head>
  <body>
    <!--
      Shown only when the device cannot reach the site. The product itself is
      server-rendered and lives at the URL in capacitor.config.ts; this file is
      the fallback Capacitor requires a webDir to contain, not a copy of it.
    -->
    <main class="card">
      <h1>CARMEN</h1>
      <p>No hay conexión. La app necesita internet para mostrar tu información clínica; vuelve a intentarlo cuando tengas señal.</p>
    </main>
  </body>
</html>
