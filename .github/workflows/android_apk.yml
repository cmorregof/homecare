name: Android APK

# Builds the installable APK. It runs here rather than on a developer's machine
# because the Android SDK is preinstalled on GitHub's runners, so nobody needs a
# local Android Studio to produce a build the team can hand out.
#
# The APK is a shell around the deployed web app (mobile/capacitor.config.js),
# so it does not embed the product and does not need any of its secrets. It is
# rebuilt only when the shell itself changes; a change to the web app reaches
# installed phones through Vercel, without a new APK.

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android_apk.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android_apk.yml"
  # Lets anyone produce a fresh APK from the Actions tab without pushing.
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      # Needed to publish the release the APK is downloaded from.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # No setup-android step: the ubuntu-latest image already ships the SDK at
      # $ANDROID_HOME, and android-actions/setup-android@v3 fails on it — it
      # tries to install the obsolete `tools` package, which Google withdrew, so
      # sdkmanager exits 1 before the build starts. This step proves the SDK is
      # there and makes a future failure legible instead of mysterious.
      - name: Check the Android SDK the runner provides
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "${ANDROID_HOME:?the runner image should define ANDROID_HOME}"
          echo "Platforms:"; ls "$ANDROID_HOME/platforms"
          echo "Build tools:"; ls "$ANDROID_HOME/build-tools"

      - name: Install Capacitor
        working-directory: mobile
        run: npm ci

      - name: Sync the Android project with the Capacitor config
        working-directory: mobile
        run: npx cap sync android

      # Debug signing, on purpose. A debug APK installs by sideloading, which is
      # how this one is distributed. A release build would need an upload
      # keystore held as a repository secret; see mobile/README.md for what that
      # would involve, and do it before any store submission.
      - name: Build the debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Gradle names its output app-debug.apk. That is the file a person ends up
      # with on their phone, so it gets the product's name instead.
      - name: Name the APK CARMEN.apk
        run: mv app-debug.apk CARMEN.apk
        working-directory: mobile/android/app/build/outputs/apk/debug

      - uses: actions/upload-artifact@v4
        with:
          name: CARMEN
          path: mobile/android/app/build/outputs/apk/debug/CARMEN.apk
          if-no-files-found: error
          retention-days: 90

      # The commit stays recorded, just not in the filename: on a pull_request
      # event the checkout is a merge commit that exists on no branch, so the
      # head sha is the one someone can actually look up when asking which code
      # a handed-out APK came from.
      - name: Record which commit this build came from
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "**CARMEN.apk** compilada desde \`${sha:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

      # An Actions artifact is a zip behind the Actions UI and needs a GitHub
      # login, which makes it useless for handing the app to someone on a phone.
      # A release asset on a public repository is a plain URL that downloads the
      # .apk directly, so Android can install it straight from the browser:
      #
      #   https://github.com/cmorregof/homecare/releases/download/android-latest/CARMEN.apk
      #
      # Not on pull requests: a proposed change should not replace the build
      # people are installing.
      - name: Publish the APK where a phone can reach it
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          apk=mobile/android/app/build/outputs/apk/debug/CARMEN.apk
          notes=$(cat <<NOTES
          APK instalable de CARMEN, compilada desde \`${sha:0:7}\`.

          ## Instalación

          1. Descarga **CARMEN.apk** de aquí abajo, desde el propio teléfono.
          2. Ábrela. Android pedirá permitir la instalación desde orígenes
             desconocidos.
          3. **Play Protect avisará de que la aplicación puede ser dañina.**
             Es esperado. Toca «Instalar de todos modos».

          ### Por qué sale ese aviso

          La aplicación está firmada con la clave de depuración del SDK de
          Android, que es la misma en todas las máquinas de desarrollo del
          mundo, y no se distribuye por Play Store. Play Protect avisa por la
          **procedencia, no por el contenido**: no analiza qué hace la
          aplicación, solo ve que no viene de una fuente que reconozca.

          Firmarla con una clave propia suaviza el aviso pero no lo quita. Lo
          único que lo elimina del todo es publicarla en Play Store.

          ## Qué necesita

          Conexión a internet: abre la aplicación web en producción. Por eso se
          actualiza sola cuando se despliega un cambio, sin reinstalar nada.
          NOTES
          )
          # Replace the asset in place rather than recreating the release, so the
          # download URL people have already shared keeps working.
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$apk" --clobber
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest "$apk" \
              --title "CARMEN para Android" \
              --notes "$notes" \
              --latest
          fi
